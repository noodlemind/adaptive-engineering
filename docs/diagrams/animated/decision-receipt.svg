</defs>
<rect class="bg" width="960" height="440" rx="14"/>
<text class="heading" x="24" y="33">The decision-agent and its receipts</text>
<g class="node-engineer"><rect class="box" x="600" y="20" width="14" height="14" rx="4"/><text class="legend" x="620" y="31">Engineer</text></g><g class="node-harness"><rect class="box" x="712" y="20" width="14" height="14" rx="4"/><text class="legend" x="732" y="31">Harness (ae)</text></g><g class="node-review"><rect class="box" x="824" y="20" width="14" height="14" rx="4"/><text class="legend" x="844" y="31">decision-agent</text></g>
<path class="edge" d="M230 142 L260 142" marker-end="url(#decision-receipt-arrow)"/>
<path class="edge" d="M462 142 L492 142" marker-end="url(#decision-receipt-arrow)"/>
<path class="edge" d="M694 142 L724 142" marker-end="url(#decision-receipt-arrow)"/>
<path class="edge" d="M130 188 C130 296, 202 296, 260 296" marker-end="url(#decision-receipt-arrow)"/>
<path class="edge" d="M462 296 L608 296" marker-end="url(#decision-receipt-arrow)"/>
<path class="edge edge-feed" d="M826 190 C826 240, 794 236, 784 248" marker-end="url(#decision-receipt-arrow-feed)"/>
<text class="edge-label edge-label-feed" x="834" y="244">receipt</text>
<g class="node node-engineer">
<rect class="box" x="30" y="96" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-propose" x="27" y="93" width="206" height="98" rx="15"/>
<text class="title" x="130" y="131">Propose action</text>
<text class="sub" x="130" y="148">tool, full input, cwd</text><text class="sub" x="130" y="162.95">and the sources it reads</text>
<text class="owner owner-engineer" x="40" y="111">Engineer</text>
</g>
<g class="node node-harness">
<rect class="box" x="262" y="96" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-prepare" x="259" y="93" width="206" height="98" rx="15"/>
<text class="title" x="362" y="131">Prepare</text>
<text class="sub" x="362" y="148">freeze action, source hashes,</text><text class="sub" x="362" y="162.95">consent revision, budgets</text>
<text class="owner owner-harness" x="272" y="111">Harness</text>
</g>
<g class="node node-review">
<rect class="box" x="494" y="96" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-judge" x="491" y="93" width="206" height="98" rx="15"/>
<text class="title" x="594" y="131">decision-agent</text>
<text class="sub" x="594" y="148">small model where the host</text><text class="sub" x="594" y="162.95">allows; else inherits</text>
<text class="owner owner-review" x="504" y="111">Host role, read-only</text>
</g>
<g class="node node-harness">
<rect class="box" x="726" y="96" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-record" x="723" y="93" width="206" height="98" rx="15"/>
<text class="title" x="826" y="131">Record receipt</text>
<text class="sub" x="826" y="148">observed native reply</text><text class="sub" x="826" y="162.95">bound to the exact action</text>
<text class="owner owner-harness" x="736" y="111">Harness</text>
</g>
<g class="node node-engineer">
<rect class="box" x="262" y="250" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-call" x="259" y="247" width="206" height="98" rx="15"/>
<text class="title" x="362" y="291.5">Tool call</text>
<text class="sub" x="362" y="308.5">the host runs the action</text>
<text class="owner owner-engineer" x="272" y="265">Engineer</text>
</g>
<g class="node node-harness">
<rect class="box" x="610" y="250" width="200" height="92" rx="12"/>
<rect class="hl decision-receipt-hl-hook" x="607" y="247" width="206" height="98" rx="15"/>
<text class="title" x="710" y="285">Guard</text>
<text class="sub" x="710" y="302">receipt matches and</text><text class="sub" x="710" y="316.95">every other guard passes</text>
<text class="owner owner-harness" x="620" y="265">Host hook + Harness</text>
</g>
<g class="mark decision-receipt-mk-action1"><g class="node-neutral"><rect class="box" x="30" y="56" width="280" height="26" rx="8"/><text class="chip-text" x="170" y="73">Bash: node --test test/payment.test.mjs</text></g></g>
<g class="mark decision-receipt-mk-frozen"><g class="node-harness"><rect class="box" x="282" y="196" width="160" height="26" rx="8"/><text class="chip-text" x="362" y="213">request frozen</text></g></g>
<g class="mark decision-receipt-mk-verdict"><g class="node-review"><rect class="box" x="524" y="196" width="140" height="26" rx="8"/><text class="chip-text" x="594" y="213">verdict: allow</text></g></g>
<g class="mark decision-receipt-mk-receipt"><g class="node-harness"><rect class="box" x="746" y="196" width="160" height="26" rx="8"/><text class="chip-text" x="826" y="213">receipt for that action</text></g></g>
<g class="mark decision-receipt-mk-allow"><circle class="badge-ok" cx="798" cy="258" r="13"/><text class="badge-text" x="798" y="262.5">✓</text><g class="node-harness"><rect class="box" x="630" y="350" width="160" height="26" rx="8"/><text class="chip-text" x="710" y="367">allowed, receipt consumed</text></g></g>
<g class="mark decision-receipt-mk-action2"><g class="node-deny"><rect class="box" x="30" y="56" width="280" height="26" rx="8"/><text class="chip-text" x="170" y="73">Bash: node --test test/  (changed argument)</text></g></g>
<g class="mark decision-receipt-mk-deny"><circle class="badge-deny" cx="798" cy="258" r="13"/><text class="badge-text" x="798" y="262.5">✕</text><g class="node-deny"><rect class="box" x="620" y="350" width="180" height="26" rx="8"/><text class="chip-text" x="710" y="367">receipt does not apply</text></g></g>
<g class="decision-receipt-tok-o anim"><g class="decision-receipt-tok"><circle class="tok-glow" r="15"/><circle class="tok" r="8"/></g></g>
<text class="caption anim decision-receipt-cap-0" x="480" y="414">The Engineer proposes one exact action: the tool, its full input and where it runs.</text>
<text class="caption anim decision-receipt-cap-1" x="480" y="414">The Harness freezes that action with source hashes, consent revision and budgets.</text>
<text class="caption anim decision-receipt-cap-2" x="480" y="414">The host runs the read-only decision-agent, on a small model where the host allows it.</text>
<text class="caption anim decision-receipt-cap-3" x="480" y="414">The Harness records the observed reply as a receipt tied to that exact action.</text>
<text class="caption anim decision-receipt-cap-4" x="480" y="414">The Engineer makes the tool call with the identical arguments.</text>
<text class="caption anim decision-receipt-cap-5" x="480" y="414">The receipt matches and every remaining guard passes, so the call is allowed.</text>
<text class="caption anim decision-receipt-cap-6" x="480" y="414">Now one argument changes.</text>
<text class="caption anim decision-receipt-cap-7" x="480" y="414">The new call is not the action that was judged.</text>
<text class="caption anim decision-receipt-cap-8" x="480" y="414">No receipt matches it, so it needs a fresh judgment. A later denial always wins.</text>
<text class="caption anim decision-receipt-cap-9" x="480" y="414">A receipt never grants trust, user authority or wider scope, and never replaces named checks.</text>
<text class="caption static" x="480" y="414">A receipt approves one exact action. It never grants trust, user authority or scope, and never replaces named checks.</text>
<rect class="bar-track" x="0" y="434" width="960" height="6"/>
<rect class="bar decision-receipt-bar" x="0" y="434" width="960" height="6"/>
</svg>
