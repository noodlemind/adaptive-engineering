<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · Adaptive Engineering</title>
  <style>
    :root { color-scheme: light dark; font: 17px/1.65 system-ui, sans-serif; }
    body { max-width: 820px; margin: auto; padding: 2rem 1.25rem 5rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1.25rem; padding-bottom: 2rem; border-bottom: 1px solid #8885; }
    a { color: light-dark(#1752a2, #9fc5ff); text-underline-offset: .2em; }
    h1, h2, h3 { line-height: 1.25; margin-top: 2rem; }
    pre { overflow: auto; padding: 1rem; background: #8881; border: 1px solid #8883; }
    code { font-size: .88em; }
    table { display: block; overflow: auto; border-collapse: collapse; }
    td, th { padding: .5rem .75rem; border: 1px solid #8884; text-align: left; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    footer { margin-top: 4rem; font-size: .9em; border-top: 1px solid #8885; padding-top: 1rem; }
  </style>
</head>
<body>
  <nav aria-label="Documentation">
    <a href="{{ '/' | relative_url }}">Adaptive Engineering</a>
    <a href="{{ '/getting-started/' | relative_url }}">Getting started</a>
    <a href="{{ '/using-ae/' | relative_url }}">Using AE</a>
    <a href="{{ '/hosts/' | relative_url }}">Hosts</a>
    <a href="{{ '/concept/' | relative_url }}">How it works</a>
    <a href="{{ '/migration/' | relative_url }}">Migration</a>
    <a href="https://github.com/{{ site.repository }}">Source</a>
  </nav>
  <main>{{ content }}</main>
  <footer>Documentation is maintained in the repository.</footer>
  <script type="module">
    // kramdown emits code.language-mermaid; with Rouge the language class sits on the wrapper div.
    const blocks = [...document.querySelectorAll('pre > code.language-mermaid, .language-mermaid pre > code')];
    if (blocks.length) {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs');
      for (const code of blocks) {
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;
        (code.parentElement.closest('.language-mermaid') || code.parentElement).replaceWith(diagram);
      }
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default' });
      await mermaid.run({ querySelector: 'div.mermaid' });
    }
  </script>
</body>
</html>
