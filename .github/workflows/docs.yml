name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/getting-started.md'
      - 'docs/using-ae.md'
      - 'docs/hosts.md'
      - 'docs/adaptive-engineering.md'
      - 'docs/migration/ae.md'
      - 'docs/reference/project-setup.md'
      - 'docs/reference/plans-and-proof.md'
      - 'docs/reference/verification.md'
      - 'docs/reference/context.md'
      - 'docs/reference/structural-knowledge.md'
      - 'docs/reference/workspace-layout-detection.md'
      - 'docs/reference/domains.md'
      - 'docs/reference/flows.md'
      - 'docs/reference/performance.md'
      - 'docs/reference/experiments.md'
      - 'docs/reference/capability-lifecycle.md'
      - 'docs/reference/model-preferences.md'
      - 'docs/site/**'
      - 'docs/diagrams/animated/**'
      - 'scripts/build-docs.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed documentation to Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare canonical sources
        run: node scripts/build-docs.mjs docs-build
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: docs-build
          destination: _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
