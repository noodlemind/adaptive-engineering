# Pull requests run the fast tier: every test file whose recorded duration is
# at most 30 seconds plus every new, unmeasured file (scripts/ci-tests.mjs
# `--suite fast`), in one job. The complete suite runs on the machine that
# opens the PR (`node scripts/full-suite.mjs`, which prints the receipt for the
# PR description) and here only on manual dispatch, in four shards.
name: Harness Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: linux-tests (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"suite":"source","shard":1,"shards":4},{"suite":"source","shard":2,"shards":4},{"suite":"source","shard":3,"shards":4},{"suite":"source","shard":4,"shards":4}]' || '[{"suite":"fast","shard":1,"shards":1}]') }}
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — nothing in this job talks to GitHub after
      # the clone, so the job token has no reason to sit in `.git/config` where
      # every later step (and every action they invoke) could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Node 22 here; package-candidate.yml covers the `engines: >=20` floor
      # and Node 24. The suite is pure Node over four bundled runtime
      # dependencies, so one version keeps compute down.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/ae/package-lock.json

      # No optionalDependencies: Tree-sitter's runtime and grammar WASM are
      # vendored under packages/ae/lib/repo-map/vendor and checked by
      # check:release, so the install needs no native build.
      - name: Install harness dependencies
        run: npm ci --prefix packages/ae

      - name: Harness test suite
        shell: bash
        env:
          HARNESS_PROOF_LOG: ${{ github.workspace }}/delivery-transcripts.jsonl
          # Flow-model tests skip on Git < 2.45; CI must run them.
          AE_REQUIRE_NO_LAZY_FETCH: '1'
        run: node scripts/ci-tests.mjs --suite ${{ matrix.suite }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} 2>&1 | tee harness-tests.log

      - name: Preserve test and installed-delivery output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-tests-${{ matrix.shard }}
          path: |
            harness-tests.log
            ci-test-results/
            delivery-transcripts.jsonl

  # Keep the required check named "test" and reject incomplete or failed shards.
  test:
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: linux-tests-*
          path: linux-shards
      - name: Require complete same-revision test inventory
        env:
          SUITE: ${{ github.event_name == 'workflow_dispatch' && 'source' || 'fast' }}
          SHARDS: ${{ github.event_name == 'workflow_dispatch' && '4' || '1' }}
        run: node scripts/ci-tests.mjs --verify-manifests linux-shards --suite "$SUITE" --shards "$SHARDS" --platform linux --node-major 22
      - name: Require every shard job to succeed
        if: always()
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: node --input-type=module -e "if (process.env.SUITES_RESULT !== 'success') process.exit(1)"
