# Publishes the enterprise overlay as a build artifact for team pipelines.
# Teams extract it into the host configuration's enterprise/ directory.
name: Enterprise Hydrate

on:
  push:
    branches: [main]
    paths:
      - 'packages/ae/corpus/enterprise/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate enterprise registry
        run: |
          test -f packages/ae/corpus/enterprise/capability-registry.enterprise.yaml
          test -f packages/ae/corpus/enterprise/README.md
      - name: Archive enterprise overlay
        run: |
          tar -czf enterprise-overlay.tar.gz -C packages/ae/corpus enterprise/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-overlay
          path: enterprise-overlay.tar.gz
          retention-days: 90

